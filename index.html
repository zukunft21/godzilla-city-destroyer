<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🦖 고질라 도시 파괴 게임</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Arial Black', sans-serif; color: #0f0; }
  #hud { display: flex; gap: 40px; padding: 10px 20px; font-size: 20px; font-weight: bold; }
  #gameWrap { position: relative; border: 3px solid #0f0; box-shadow: 0 0 20px #0f0; }
  canvas { display: block; }
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  #overlay h1 { font-size: 52px; color: #0f0; text-shadow: 0 0 20px #0f0; }
  #overlay button { margin-top: 20px; padding: 14px 40px; font-size: 22px; font-weight: bold; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 6px; }
</style>
</head>
<body>
<div id="hud">
  <span>⭐ 점수: <b id="score">0</b></span>
  <span>❤️ HP: <b id="hp">500</b></span>
  <span>⚡ 레벨: <b id="level">1</b></span>
</div>
<div id="gameWrap">
  <canvas id="canvas" width="800" height="480"></canvas>
  <div id="overlay">
    <h1>🦖 고질라</h1>
    <p style="font-size:24px;color:#0f0;margin:10px 0">도시를 파괴하라!</p>
    <p style="color:#888">← → 이동 | Space 파이어볼 | Z 포효</p>
    <button id="startBtn">게임 시작</button>
  </div>
</div>
<div style="margin-top:8px;color:#555;font-size:13px">← → 이동 | Space 파이어볼 | Z 포효(범위공격)</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
let score=0, hp=500, maxHp=500, level=1, gameRunning=false;
let buildings=[], particles=[], missiles=[], fireballs=[], explosions=[];
let keys={};
let gameOver=false;
let invincibleTimer=0;
let graceTimer=300;
let hitFlash=0;
let missileTimer=0;

const godzilla = {
  x:100, y:0, w:70, h:130, vx:0, vy:0,
  onGround:false, frame:0, frameTimer:0, dir:1,
  roaring:false, roarTime:0, fireTimer:0,
  draw(){
    ctx.save();
    ctx.translate(this.x+this.w/2, this.y+this.h);
    ctx.scale(this.dir,1);
    const t=this.frame;
    ctx.fillStyle='#2a6b2a';
    ctx.beginPath();
    ctx.moveTo(-35,-20);
    ctx.quadraticCurveTo(-70,-10+Math.sin(t)*8,-80,10);
    ctx.quadraticCurveTo(-70,5,-35,-5);
    ctx.fill();
    ctx.fillStyle='#2d7a2d';
    ctx.beginPath();
    ctx.ellipse(0,-55,28,45,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#5aaa5a';
    ctx.beginPath();
    ctx.ellipse(5,-50,16,30,0.1,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#1a5c1a';
    for(let i=0;i<5;i++){
      const sx=-10+i*5, sy=-100+i*10;
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx-5,sy-18+i*2);
      ctx.lineTo(sx+5,sy);
      ctx.fill();
    }
    ctx.fillStyle='#2d7a2d';
    ctx.beginPath();
    ctx.ellipse(8,-105,22,18,-0.2,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=this.roaring?'#ff0':'#ff3300';
    ctx.beginPath();
    ctx.arc(18,-112,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(20,-112,2.5,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1a1';
    ctx.lineWidth=2;
    if(this.roaring){
      ctx.fillStyle='#f44';
      ctx.beginPath();
      ctx.ellipse(25,-100,12,8,0.3,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(15,-96);
      ctx.lineTo(32,-98);
      ctx.stroke();
    }
    ctx.fillStyle='#2d7a2d';
    const armSwing=Math.sin(t*0.3)*10;
    ctx.beginPath();
    ctx.ellipse(28,-70+armSwing,8,18,0.4,0,Math.PI*2);
    ctx.fill();
    const legSwing=Math.sin(t*0.3)*15;
    ctx.fillStyle='#266626';
    ctx.beginPath();
    ctx.ellipse(-8,-18+legSwing,12,20,0.1,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(14,-18-legSwing,12,20,-0.1,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#1a5c1a';
    ctx.beginPath();
    ctx.ellipse(-8,0,15,8,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(14,0,15,8,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  },
  update(){
    this.vx=0;
    if(keys['ArrowLeft']){this.vx=-4;this.dir=-1;}
    if(keys['ArrowRight']){this.vx=4;this.dir=1;}
    this.vy+=0.6;
    this.x+=this.vx;
    this.y+=this.vy;
    const ground=H-80;
    if(this.y+this.h>=ground){this.y=ground-this.h;this.vy=0;this.onGround=true;}
    else this.onGround=false;
    this.x=Math.max(0,Math.min(W-this.w,this.x));
    if(this.vx!==0){this.frameTimer++;if(this.frameTimer>4){this.frame++;this.frameTimer=0;}}
    if(this.roaring){this.roarTime--;if(this.roarTime<=0)this.roaring=false;}
    if(this.fireTimer>0)this.fireTimer--;
    if(invincibleTimer>0)invincibleTimer--;
    buildings.forEach(b=>{
      if(!b.destroyed){
        if(this.x+this.w>b.x&&this.x<b.x+b.w&&this.y+this.h>b.y&&this.y<b.y+b.h){
          b.damage(30);
          spawnParticles(b.x+b.w/2,b.y,b.color,8);
        }
      }
    });
  }
};

class Building {
  constructor(x,w,h,color){
    this.x=x;this.w=w;this.h=h;this.y=H-80-h;this.color=color;
    this.hp=h*1.5;this.maxHp=this.hp;this.destroyed=false;this.shakeX=0;
    this.windows=this.makeWindows();this.fallY=0;this.falling=false;
  }
  makeWindows(){
    const wins=[];
    const cols=Math.floor(this.w/18), rows=Math.floor(this.h/22);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)wins.push({c,r,on:Math.random()>0.3});
    return wins;
  }
  damage(dmg){
    if(this.destroyed)return;
    this.hp-=dmg;this.shakeX=6;
    if(this.hp<=0){
      this.hp=0;this.destroyed=true;this.falling=true;
      score+=Math.floor(this.h/10)*10;
      document.getElementById('score').textContent=score;
      spawnParticles(this.x+this.w/2,this.y+this.h/2,this.color,30);
      checkLevelUp();
    }
  }
  draw(){
    if(this.destroyed&&this.fallY>this.h+50)return;
    const dy=this.y+(this.falling?this.fallY:0);
    ctx.save();
    ctx.translate(this.shakeX,0);
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x,dy,this.w,this.h);
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;
    ctx.strokeRect(this.x,dy,this.w,this.h);
    const lit=this.hp/this.maxHp;
    this.windows.forEach(win=>{
      const wx=this.x+5+win.c*18, wy=dy+5+win.r*22;
      if(wx+12>this.x&&wx<this.x+this.w){
        ctx.fillStyle=win.on&&lit>0.3?'rgba(255,255,'+(Math.floor(100+lit*155))+',0.9)':'rgba(30,30,50,0.8)';
        ctx.fillRect(wx,wy,10,14);
      }
    });
    if(this.hp>0&&this.hp<this.maxHp){
      const bw=this.w-4;
      ctx.fillStyle='#300';ctx.fillRect(this.x+2,dy-8,bw,5);
      ctx.fillStyle='hsl('+(this.hp/this.maxHp*120)+',100%,50%)';
      ctx.fillRect(this.x+2,dy-8,bw*(this.hp/this.maxHp),5);
    }
    ctx.restore();
  }
  update(){
    if(this.shakeX>0)this.shakeX-=1.5;
    if(this.shakeX<0)this.shakeX=0;
    if(this.falling)this.fallY+=5;
  }
}

class Fireball {
  constructor(x,y,dir){this.x=x;this.y=y;this.vx=dir*10;this.vy=-2;this.alive=true;this.frame=0;}
  update(){
    this.x+=this.vx;this.vy+=0.15;this.y+=this.vy;this.frame++;
    if(this.x<0||this.x>W||this.y>H){this.alive=false;return;}
    buildings.forEach(b=>{
      if(!b.destroyed&&this.alive&&this.x>b.x&&this.x<b.x+b.w&&this.y>b.y&&this.y<b.y+b.h){
        b.damage(60);spawnParticles(this.x,this.y,'#f80',20);
        explosions.push(new Explosion(this.x,this.y));this.alive=false;
      }
    });
  }
  draw(){
    for(let i=0;i<3;i++){
      const r=18-i*4, colors=['#f80','#ff4','#f00'];
      ctx.beginPath();ctx.arc(this.x-i*3*Math.sign(this.vx),this.y,r,0,Math.PI*2);
      ctx.fillStyle=colors[i];ctx.globalAlpha=0.8-i*0.2;ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

class Missile {
  constructor(){
    this.x=Math.random()>0.5?-20:W+20;
    this.y=100+Math.random()*200;
    this.vx=this.x<0?1.5+level*0.2:-(1.5+level*0.2);
    this.vy=0.5;this.alive=true;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<-30||this.x>W+30){this.alive=false;return;}
    const g=godzilla;
    if(this.x>g.x&&this.x<g.x+g.w&&this.y>g.y&&this.y<g.y+g.h){
      if(invincibleTimer<=0){
        hp=Math.max(0,hp-2);
        document.getElementById('hp').textContent=Math.floor(hp);
        spawnParticles(this.x,this.y,'#f00',12);
        explosions.push(new Explosion(this.x,this.y));
        invincibleTimer=120;hitFlash=15;
        if(hp<=0)endGame();
      }
      this.alive=false;
    }
  }
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(Math.atan2(this.vy,this.vx));
    ctx.fillStyle='#888';ctx.fillRect(-15,-4,30,8);
    ctx.fillStyle='#f80';
    ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(8,-4);ctx.lineTo(8,4);ctx.fill();
    ctx.fillStyle='#fa0';
    ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(-25,-4);ctx.lineTo(-25,4);ctx.fill();
    ctx.restore();
  }
}

class Explosion {
  constructor(x,y){this.x=x;this.y=y;this.r=5;this.alpha=1;this.alive=true;}
  update(){this.r+=4;this.alpha-=0.05;if(this.alpha<=0)this.alive=false;}
  draw(){
    ctx.save();ctx.globalAlpha=this.alpha;
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    g.addColorStop(0,'#fff');g.addColorStop(0.3,'#ff8');g.addColorStop(0.7,'#f40');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2, speed=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,life:1,color,size:3+Math.random()*5});
  }
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H*0.6);
  sky.addColorStop(0,'#050510');sky.addColorStop(1,'#1a1a40');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.6);
  ctx.fillStyle='#ffe';ctx.shadowColor='#ffe';ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(700,60,35,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  for(let i=0;i<60;i++){ctx.beginPath();ctx.arc((i*137)%W,(i*79)%200,0.5+(i%3)*0.5,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#111128';
  for(let i=0;i<15;i++){ctx.fillRect(i*60,H*0.6-(40+i%5*20),40,40+i%5*20);}
  const ground=ctx.createLinearGradient(0,H-80,0,H);
  ground.addColorStop(0,'#333');ground.addColorStop(1,'#111');
  ctx.fillStyle=ground;ctx.fillRect(0,H-80,W,80);
  ctx.fillStyle='#222';ctx.fillRect(0,H-50,W,30);
  ctx.fillStyle='#555';
  for(let i=0;i<W;i+=60)ctx.fillRect(i,H-37,35,5);
}

function drawRoarEffect(){
  if(!godzilla.roaring)return;
  const cx=godzilla.x+godzilla.w/2, cy=godzilla.y+godzilla.h/2;
  const t=1-godzilla.roarTime/40;
  for(let i=1;i<=4;i++){
    ctx.beginPath();ctx.arc(cx,cy,i*60*t+20,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,255,100,'+(0.5-t*0.4)+')';ctx.lineWidth=3;ctx.stroke();
  }
}

function spawnBuildings(){
  buildings=[];
  const colors=['#445566','#556677','#667788','#4a5a7a','#5a6a8a','#3a4a6a','#6a7a9a'];
  let x=150;
  while(x<W-60){
    const w=45+Math.floor(Math.random()*40), h=80+Math.floor(Math.random()*160);
    buildings.push(new Building(x,w,h,colors[Math.floor(Math.random()*colors.length)]));
    x+=w+8+Math.random()*15;
  }
}

function checkLevelUp(){
  const destroyed=buildings.filter(b=>b.destroyed).length;
  if(destroyed>=buildings.length*0.7&&level<5){
    level++;document.getElementById('level').textContent=level;
    spawnBuildings();spawnParticles(W/2,H/2,'#ff0',40);
  }
}

function updateMissiles(){
  if(graceTimer>0){graceTimer--;return;}
  missileTimer++;
  const interval=Math.max(180,360-level*20);
  if(missileTimer>=interval){missiles.push(new Missile());missileTimer=0;}
}

function drawMissileWarnings(){
  missiles.forEach(m=>{
    if(m.x<0||m.x>W)return;
    const arrowX=m.x<50?20:(m.x>W-50?W-20:m.x);
    const arrowY=Math.max(20,Math.min(H-100,m.y));
    ctx.save();ctx.fillStyle='rgba(255,50,50,0.85)';ctx.font='bold 22px Arial';
    ctx.fillText(m.x<W/2?'◄ ⚠️':'⚠️ ►',arrowX-20,arrowY);ctx.restore();
  });
}

function endGame(){
  gameRunning=false;
  const overlay=document.getElementById('overlay');
  overlay.innerHTML='<h1>💀 게임 오버</h1><p style="font-size:28px;color:#0f0;margin:20px 0">최종 점수: '+score+'</p><p style="color:#aaa">레벨 '+level+' 도달!</p><button onclick="location.reload()">다시 플레이</button>';
  overlay.style.display='flex';
}

function gameLoop(){
  if(!gameRunning)return;
  ctx.clearRect(0,0,W,H);
  drawBackground();
  
  particles=particles.filter(p=>p.life>0.05);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.03;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    const r=Math.max(0.5,p.size*p.life);
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
  
  buildings.forEach(b=>{b.update();b.draw();});
  
  fireballs=fireballs.filter(f=>f.alive);
  fireballs.forEach(f=>{f.update();f.draw();});
  
  if(hp<maxHp){hp=Math.min(maxHp,hp+0.05);document.getElementById('hp').textContent=Math.floor(hp);}
  
  updateMissiles();
  missiles=missiles.filter(m=>m.alive);
  missiles.forEach(m=>{m.update();m.draw();});
  
  explosions=explosions.filter(e=>e.alive);
  explosions.forEach(e=>{e.update();e.draw();});
  
  drawRoarEffect();
  drawMissileWarnings();
  
  godzilla.update();
  godzilla.draw(); // 항상 표시 - 까바기멀 제거
  
  if(hitFlash>0){
    ctx.fillStyle='rgba(255,0,0,'+(hitFlash*0.04)+')';
    ctx.fillRect(0,0,W,H);hitFlash--;
  }
  
  if(graceTimer>0){
    const sec=Math.ceil(graceTimer/60);
    ctx.save();ctx.fillStyle='rgba(0,255,0,0.5)';ctx.font='bold 14px Arial';
    ctx.fillText('🛡️ 무적 '+sec+'초',W-100,30);ctx.restore();
  }
  
  const barW=200,barH=16,barX=10,barY=H-70;
  ctx.fillStyle='#300';ctx.fillRect(barX,barY,barW,barH);
  const hpRatio=hp/maxHp;
  ctx.fillStyle=hpRatio>0.5?'#0f0':hpRatio>0.25?'#ff0':'#f00';
  ctx.fillRect(barX,barY,barW*hpRatio,barH);
  ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle='#fff';ctx.font='bold 11px Arial';
  ctx.fillText('❤️ '+Math.floor(hp)+' / '+maxHp,barX+4,barY+12);
  
  requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'&&gameRunning){
    e.preventDefault();
    if(godzilla.fireTimer<=0){
      const fx=godzilla.x+(godzilla.dir>0?godzilla.w:0);
      const fy=godzilla.y+godzilla.h*0.3;
      fireballs.push(new Fireball(fx,fy,godzilla.dir));
      godzilla.fireTimer=25;
    }
  }
  if(e.code==='KeyZ'&&gameRunning){
    if(!godzilla.roaring){
      godzilla.roaring=true;godzilla.roarTime=40;
      const cx=godzilla.x+godzilla.w/2;
      buildings.forEach(b=>{if(Math.abs((b.x+b.w/2)-cx)<250)b.damage(50);});
      missiles.forEach(m=>{if(Math.abs(m.x-cx)<250){m.alive=false;spawnParticles(m.x,m.y,'#0f0',10);}});
    }
  }
});
window.addEventListener('keyup',e=>keys[e.code]=false);

function startGame(){
  document.getElementById('overlay').style.display='none';
  score=0;hp=500;maxHp=500;level=1;gameRunning=false;gameOver=false;
  document.getElementById('score').textContent=0;
  document.getElementById('hp').textContent=500;
  document.getElementById('level').textContent=1;
  buildings=[];particles=[];missiles=[];fireballs=[];explosions=[];
  missileTimer=0;invincibleTimer=0;graceTimer=300;hitFlash=0;
  godzilla.x=60;godzilla.y=300;godzilla.vx=0;godzilla.vy=0;
  spawnBuildings();gameRunning=true;gameLoop();
}

document.getElementById('startBtn').addEventListener('click',startGame);
</script>
</body>
</html>
